name: Release TreeSeed Reviewer
on:
  push:
    tags: ["*.*.*"]
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: mkdir -p artifacts && npm pack --json --ignore-scripts --pack-destination artifacts
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        shell: bash
        run: |
          sha256sum artifacts/*.tgz > artifacts/SHA256SUMS
          args=(--generate-notes --verify-tag)
          [[ "${GITHUB_REF_NAME}" == *-rc.* ]] && args+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" artifacts/* "${args[@]}"
