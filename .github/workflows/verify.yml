name: Verify TreeSeed Reviewer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hydrate exact verified TreeSeed SDK artifact
        env:
          GH_TOKEN: ${{ secrets.TREESEED_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TREESEED_SDK_SHA="$(node -p "require('./package.json').dependencies['@treeseed/sdk'].split('#').at(-1)")"
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo treeseed-ai/sdk --workflow verify.yml --commit "${TREESEED_SDK_SHA}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            [[ -n "${run_id}" ]] && break
            sleep 10
          done
          test -n "${run_id}"
          mkdir -p .treeseed/sdk-artifact
          gh run download "${run_id}" --repo treeseed-ai/sdk --name "sdk-${TREESEED_SDK_SHA}" --dir .treeseed/sdk-artifact
          npm install --no-save --ignore-scripts --no-audit --no-fund .treeseed/sdk-artifact/*.tgz
          node -e "import('@treeseed/sdk/guarantees')"
      - run: npm run verify
      - name: Pack verified artifact
        run: mkdir -p artifacts && npm pack --json --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
