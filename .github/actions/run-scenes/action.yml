name: Verify exact TreeSeed scenes
description: Execute the existing Reviewer scene runner against the owner checkout and retain immutable evidence.
inputs:
  ids:
    description: Comma-separated exact guarantee IDs in the owner checkout.
    required: true
runs:
  using: composite
  steps:
    - name: Require immutable Reviewer source
      id: reviewer-source
      shell: bash
      env:
        REVIEWER_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        [[ "${REVIEWER_REF}" =~ ^[0-9a-f]{40}$ ]] || { echo 'Reviewer scenes require an exact commit.' >&2; exit 1; }
        test -d node_modules
        test ! -e .treeseed/tools/reviewer
        printf 'ref=%s\n' "$REVIEWER_REF" >> "$GITHUB_OUTPUT"
    - name: Check out the exact executing Reviewer candidate
      uses: actions/checkout@v4
      with:
        repository: treeseed-ai/reviewer
        ref: ${{ steps.reviewer-source.outputs.ref }}
        path: .treeseed/tools/reviewer
        persist-credentials: false
        fetch-depth: 1
    - name: Install Reviewer native prerequisite toolchain
      uses: erlef/setup-beam@v1
      with:
        otp-version: "27.3.4.18"
        elixir-version: "1.17.3"
    - name: Install the executing Reviewer suite dependencies
      shell: bash
      run: npm ci --prefix .treeseed/tools/reviewer --ignore-scripts --no-audit --no-fund
    - name: Install the executing Reviewer exact SDK artifact
      uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@77a6908d4e7580716e9e2ab92de80150b02cdb06
      env:
        NODE_ENV: production
      with:
        github-token: ${{ github.token }}
        paths: .treeseed/tools/reviewer/node_modules/@treeseed/sdk
    - name: Build the executing Reviewer archive assets
      shell: bash
      run: npm run --prefix .treeseed/tools/reviewer build:dist
    - name: Execute owner scenes
      shell: bash
      env:
        SCENE_IDS: ${{ inputs.ids }}
      run: |
        set -euo pipefail
        node --import ./.treeseed/tools/reviewer/node_modules/tsx/dist/loader.mjs .treeseed/tools/reviewer/src/verifiers/guarantees/command.ts \
          --workspace "${GITHUB_WORKSPACE}" --environment local --ids "${SCENE_IDS}" \
          --run-id "actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
    - name: Retain scene evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scene-evidence-${{ github.sha }}-${{ github.run_attempt }}
        path: .treeseed/guarantees/runs/actions-${{ github.run_id }}-${{ github.run_attempt }}/
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
