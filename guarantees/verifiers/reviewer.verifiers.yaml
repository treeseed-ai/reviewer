schemaVersion: treeseed.guarantee-verifiers/v1
ownerPackage: "@treeseed/reviewer"
verifiers:
  reviewer.prerequisites.transitive-custody:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: retains ongoing custody of transitive owners throughout native scene execution
  reviewer.prerequisites.composition:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/unit/guarantees/prerequisites.test.ts
    testName: resolves arbitrary workspace owners and only the declared transitive target closure
  reviewer.prerequisites.invalid-composition:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/unit/guarantees/prerequisites.test.ts
    testName: rejects missing duplicate malformed and unbound owner or target declarations
  reviewer.prerequisites.transitive-suites:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: runs declared transitive integrated owners once and blocks every scene on an indirect failure
  reviewer.prerequisites.unknown-owners:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: blocks unknown and ambiguous integrated dependencies before any native side effect
  reviewer.prerequisites.declared-owner:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: tests the declared guarantee owner even when its verifier belongs to another package
  reviewer.prerequisites.exact-candidate:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/unit/guarantees/prerequisites.test.ts
    testName: compares both exact HEAD and source bytes without disclosing source contents
  reviewer.prerequisites.lost-candidate:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/unit/guarantees/prerequisites.test.ts
    testName: rejects missing candidate custody without throwing or substituting an old receipt
  reviewer.prerequisites.cross-owner-change:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: blocks all scenes when a later owner suite changes an earlier tested candidate
  reviewer.prerequisites.scene-change:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: rejects zero-exit scene candidate changes before another scene can execute
  reviewer.prerequisites.final-custody:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: retains passed suite receipts but fails a final scene that destroys Git custody
  reviewer.prerequisites.complete:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/unit/guarantees/prerequisites.test.ts
    testName: accepts only complete observed full-suite evidence without skipped pending or failed boundaries
  reviewer.prerequisites.malformed:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/unit/guarantees/prerequisites.test.ts
    testName: rejects malformed skipped failed absent and unmeasured assertion evidence
  reviewer.prerequisites.entrypoint:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/unit/guarantees/prerequisites.test.ts
    testName: resolves the declared complete test entrypoint without filters and rejects cyclic missing or hooked delegation
  reviewer.prerequisites.order:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: runs every owning unit and integration assertion before any scene and repeats suites for a fresh invocation
  reviewer.prerequisites.failed:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: blocks native scene side effects when an unselected unit test fails
  reviewer.prerequisites.skipped:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: blocks acceptance when the complete integration suite contains a skipped assertion
  reviewer.prerequisites.missing:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: does not execute prerequisites while planning and rejects a missing full test entrypoint before scenes
  reviewer.prerequisites.empty:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: rejects empty suites and filtered test entrypoints before native scene execution
  reviewer.prerequisites.mutation:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: rejects a candidate mutation performed by a passing full suite and retains exact prerequisite custody
  reviewer.prerequisites.deduplicate:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: deduplicates prerequisite suites across dependent guarantees only within the same invocation
  reviewer.prerequisites.owners:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: blocks every scene when a different participating owner has failing prerequisites
  reviewer.prerequisites.custody:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/integration/guarantee-prerequisites.test.ts
    testName: rejects an escaped test config and missing Git custody without scene side effects
  reviewer.workplan.package-local:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/contract/workplan-packaging.test.ts
    testName: writes directives, evidence manifest, context, and agent brief
    description: Package-local verifier proves a reviewed guarantee run can be converted into a workplan with copied evidence and an agent brief.
  reviewer.evidence.rejects-outside-workspace:
    kind: vitestCase
    ownerPackage: "@treeseed/reviewer"
    testFile: tests/contract/route-contracts.test.ts
    testName: rejects evidence paths outside the workspace
    description: Evidence access rejects paths outside the local workspace boundary.
